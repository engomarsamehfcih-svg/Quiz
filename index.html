*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:640px;margin:0 auto}

.sub{text-align:center;color:var(--mute);font-size:1.2rem;margin:6px 0 34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
label{display:block;font-weight:700;font-size:1.15rem;margin-bottom:14px}
.row{display:flex;gap:16px}
input{flex:1;min-width:0;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:1.3rem;text-align:center;font-family:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{background:var(--accent);color:#0b0e17;border:0;border-radius:14px;padding:0 30px;font-size:1.2rem;font-weight:700;font-family:inherit;cursor:pointer}
button:hover{filter:brightness(1.08)}
#res{margin-top:22px}
#res:empty{display:none}
.out{margin-top:0;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:6px 18px}
.name{font-weight:700;font-size:1.15rem;padding:12px 0;border-bottom:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute)}
.kv b{direction:ltr;unicode-bidi:plaintext}
.err{color:var(--warn);text-align:center;padding:6px 0}
.notes{direction:ltr;text-align:left;margin-top:24px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:22px;padding:22px 26px}
.notes h3{margin:0 0 14px;color:var(--warn);font-size:1.25rem}
.notes p{margin:0 0 12px;font-size:1.2rem;line-height:1.55}
.notes p:last-child{margin:0}
@media(max-width:480px){h1{font-size:1.7rem}.card,.notes{padding:20px}button{padding:0 20px}}
