<style>
:root{--bg:#f4f6fb;--card:#ffffff;--text:#1d2433;--muted:#667085;--accent:#2f5bea;--accent-text:#ffffff;--border:#e2e6f0;--ok:#e8f5ec;--err:#fdecec;--err-text:#b42318;--shadow:0 6px 24px rgba(30,45,90,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--text:#e8ecf5;--muted:#9aa4b8;--accent:#6c8cff;--accent-text:#0b1020;--border:#27314a;--ok:#14281c;--err:#2c1717;--err-text:#ff9b94;--shadow:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--text:#e8ecf5;--muted:#9aa4b8;--accent:#6c8cff;--accent-text:#0b1020;--border:#27314a;--ok:#14281c;--err:#2c1717;--err-text:#ff9b94;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;display:flex;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:480px}
h1{font-size:1.7rem;margin:12px 0 4px;text-align:center}
.course{text-align:center;color:var(--muted);margin:0 0 22px}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);direction:ltr;text-align:center}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;padding:12px 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);cursor:pointer}
button:active{transform:scale(.97)}
#res{margin-top:16px}
.card{border-radius:14px;padding:16px;background:var(--ok);border:1px solid var(--border)}
.card h2{margin:0 0 12px;font-size:1.1rem;line-height:1.6}
.item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--border)}
.item span:first-child{color:var(--muted)}
.item span:last-child{font-weight:700;text-align:left}
.err{background:var(--err);color:var(--err-text);border-radius:14px;padding:14px;text-align:center;font-weight:600}
.note{margin-top:18px;text-align:center;color:var(--muted);font-size:.9rem}
</style>
</head>
