<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--text:#1b2330;--muted:#667085;--accent:#2457d6;--accent-t:#fff;--line:#e3e8f2;--ok:#e8f1ff;--err:#fdecec;--errt:#a12a2a;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#171e29;--text:#eef2f8;--muted:#9aa6b8;--accent:#6c97ff;--accent-t:#0b1020;--line:#283244;--ok:#1b2a47;--err:#3a1c1f;--errt:#ff9a9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#171e29;--text:#eef2f8;--muted:#9aa6b8;--accent:#6c97ff;--accent-t:#0b1020;--line:#283244;--ok:#1b2a47;--err:#3a1c1f;--errt:#ff9a9a;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
h1{font-size:1.35rem;margin:8px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);direction:ltr;text-align:right}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-t);cursor:pointer}
#out{margin-top:16px}
.res{background:var(--ok);border-radius:14px;padding:16px}
.name{font-weight:700;font-size:1.1rem;margin-bottom:12px}
.big{display:flex;gap:10px;margin-bottom:12px}
.big div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.big small,.kv small{display:block;color:var(--muted);font-size:.8rem;margin-bottom:2px}
.big b{font-size:1.15rem}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.err{background:var(--err);color:var(--errt);border-radius:14px;padding:14px;text-align:center}
.note{color:var(--muted);font-size:.85rem;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main>

</main>
